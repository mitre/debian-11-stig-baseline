name: debian-11-stig-baseline
title: Debian 11 STIG-Ready Baseline
maintainer: MITRE SAF Team
copyright: MITRE
license: Apache-2.0
summary: "STIG-ready InSpec baseline for Debian 11 (bullseye), overlaying the DISA STIG for Canonical Ubuntu 20.04 LTS"
version: 0.1.0
inspec_version: ">= 4.0"

supports:
  - platform-name: debian
    release: 11.*

depends:
  - name: Canonical_Ubuntu_20-04_LTS_STIG
    git: https://github.com/mitre/canonical-ubuntu-20.04-lts-stig-baseline.git
    # Track main until the upstream cuts a tagged release that includes the
    # debian entry in its supports list; then pin to that tag.
    branch: main

inputs:
  # SV-238206: the upstream default embeds Ubuntu's cloud-image default user
  # ('ubuntu'), which does not exist on Debian. Mirror the convention with
  # Debian's cloud-image default user; sites override with their real admin
  # accounts.
  - name: sudo_accounts
    description: Array of users who are allowed to be in the sudo group
    type: Array
    value: ["debian"]
    profile: Canonical_Ubuntu_20-04_LTS_STIG
