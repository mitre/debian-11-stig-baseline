name: Build and Release Profile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  archive:
    name: Build and Validate Archive
    runs-on: ubuntu-latest
    outputs:
      archive: ${{ steps.metadata.outputs.archive }}
      tag: ${{ steps.metadata.outputs.tag }}
    env:
      LC_ALL: "en_US.UTF-8"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073  # v1.324.0
        with:
          ruby-version: "3.3"

      - name: Check release version
        id: metadata
        run: |
          ruby -ryaml -e '
            version = YAML.load_file("inspec.yml").fetch("version").to_s
            abort "Release version must use X.Y.Z" unless version.match?(/\A\d+\.\d+\.\d+\z/)
            File.open(ENV.fetch("GITHUB_ENV"), "a") do |env|
              env.puts "ARCHIVE=debian-11-stig-baseline-#{version}.tar.gz"
            end
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
              output.puts "archive=debian-11-stig-baseline-#{version}.tar.gz"
              output.puts "tag=v#{version}"
            end
          '

      - name: Run Bundle Install
        run: bundle install

      - name: Installed CINC Auditor
        run: bundle exec cinc-auditor version

      - name: Archive the Profile
        # Archive vendors dependencies and includes them with inspec.lock.
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          bundle exec cinc-auditor archive . --tar --output "$RUNNER_TEMP/release/$ARCHIVE"

      - name: Check the archived Profile
        run: |
          bundle exec cinc-auditor check "$RUNNER_TEMP/release/$ARCHIVE"
          tar -tzf "$RUNNER_TEMP/release/$ARCHIVE" > "$RUNNER_TEMP/archive-contents.txt"
          grep -Eq '(^|/)inspec.lock$' "$RUNNER_TEMP/archive-contents.txt"
          grep -Eq '(^|/)vendor/.+' "$RUNNER_TEMP/archive-contents.txt"

      - name: Generate checksum
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"

      - name: Upload archive for testing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: release-profile
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Approved Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: archive
    runs-on: ubuntu-latest
    environment: Release
    concurrency:
      group: publish-${{ needs.archive.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      ARCHIVE: ${{ needs.archive.outputs.archive }}
      RELEASE_TAG: ${{ needs.archive.outputs.tag }}
    steps:
      - name: Require configured approval protection
        # Fail if required reviewers are missing; otherwise GitHub would run without approval.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          protected=$(gh api "repos/$GH_REPO/environments/Release" \
            --jq 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length > 0))')
          if [ "$protected" != "true" ]; then
            echo "::error::Configure required reviewers for the Release environment before publishing."
            exit 1
          fi

      - name: Check out repository and tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check existing release tag
        # Never attach this build to a tag for a different commit.
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG points to a different commit. Bump version in inspec.yml."
              exit 1
            fi
          fi

      - name: Download checked archive
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: release-profile
          path: ${{ runner.temp }}/release/

      - name: Verify downloaded archive
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum -c "$ARCHIVE.sha256"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/$ARCHIVE" \
            "$RUNNER_TEMP/release/$ARCHIVE.sha256" \
            --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
