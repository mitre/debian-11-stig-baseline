name: Build and Release Profile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  profile:
    # Allow publishing; the called workflow keeps the build job read-only.
    permissions:
      contents: write
    uses: mitre/inspec-profile-workflows/.github/workflows/release.yml@45bd68c4ce71e04ded811a8ff9e6782f611611af
    with:
      publish: true
