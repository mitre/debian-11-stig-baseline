---
# see: https://kitchen.ci/docs/drivers/dokken/
#
# Vanilla only: public Debian 11 (bullseye) image from Docker Hub. Debian has
# no Iron Bank-style hardened base image, so the hardened container suite was
# dropped (card debian-11-stig-baseline-cfz.6); hardened scanning lives in the
# LXD VM suite, which converges the DEBIAN11-CIS role first.

provisioner:
  name: dummy

driver:
  name: dokken
  pull_platform_image: false

transport:
  name: dokken

platforms:
  - name: debian-11

suites:
  - name: vanilla
    driver:
      image: <%= ENV['VANILLA_CONTAINER_IMAGE'] || "docker.io/library/debian:11" %>
    verifier:
      input_files:
        - container.vanilla.inputs.yml
